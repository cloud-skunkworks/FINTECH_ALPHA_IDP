app:
  title: IDP Developer Portal
  baseUrl: http://localhost:3000

organization:
  name: FinTech Platform

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: 5432
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: backstage
      ssl:
        require: true

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  # Developers sign in to Backstage with GitHub OAuth (the IDP API itself uses Cognito JWTs)
  environment: development
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}

scaffolder:
  defaultCommitMessage: "feat(idp): provision {{ parameters.service_name }}-{{ parameters.environment }}"

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Location, Template, Resource, User, Group]
  locations:
    # Platform templates
    - type: file
      target: ./catalog/templates/eks-microservice/template.yaml
      rules:
        - allow: [Template]
    # TODO: add ecs-fargate-service and s3-data-bucket once their template.yaml
    # files exist under ./catalog/templates/ (the API catalog already lists them).
    # Registered components
    - type: url
      target: https://github.com/your-org/idp-platform/blob/main/platform/backstage/catalog/components/platform-api.yaml

# Backstage proxy used by the scaffolder (/api/proxy/idp-platform-api/v1/...).
# IDP_API_TOKEN must be a valid Cognito access token with idp:provision/idp:read scopes.
proxy:
  endpoints:
    /idp-platform-api:
      target: ${IDP_API_URL}
      headers:
        Authorization: Bearer ${IDP_API_TOKEN}

techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: ${EKS_CLUSTER_ENDPOINT}
          name: idp-eks-prod
          authProvider: aws
          awsRegion: ca-central-1
          caData: ${EKS_CA_DATA}
